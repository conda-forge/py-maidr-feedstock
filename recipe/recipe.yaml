# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.25.0"
  python_check_max: "3.14"
  # #20: parses random markdown file
  unlink_tests: core/test_plot_type_stability.py core/test_docs_quote_the_real_warning.py
  # #18: these do weird bash things
  k_scripts: (shell_guard_matches_the_python_validator or freshness_workflow_imports_resolve or fetch_script_bundles_every_asset_the_runtime_needs)
  # #18: this seems kinda vibe-broken
  k_pieplot: (pieplot or pie_schema)
  # #19: double encoding?
  k_embedding: survives_html_embedding
  # #20: not sure
  k_20: (a_log_axis_answers_its_limits_and_its_ticks_in_different_spaces or no_new_module_stashes_maidr_state_on_an_axes)
  pytest_k: not (${{ k_scripts }} or ${{ k_pieplot }} or ${{ k_embedding }} or ${{ k_20 }})

recipe:
  name: py-maidr-split
  version: ${{ version }}

source:
  - target_directory: dist
    url: https://pypi.org/packages/source/m/maidr/maidr-${{ version }}.tar.gz
    sha256: 6389ae6f6a8993459fd3b14b10be20862fb435a1c746e0a3b2e821a3261f6d50
  - target_directory: src
    url: https://github.com/xability/py-maidr/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 9b0d1c0b3cdbc7cb7b6a5a98cd08ab36753eb98f4ce3c09898ecaf362e4e6ec0

build:
  number: 0
  noarch: python

outputs:
  - package:
      name: py-maidr
    build:
      number: 0
      noarch: python
      script:
        - cd dist
        - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
    requirements:
      host:
        - hatchling
        - pip
        - python ${{ python_min }}.*
      run:
        - htmltools >=0.5
        - lxml >=5.1.0
        - mplfinance >=0.12.10b0
        - numpy >=1.26
        - python >=${{ python_min }}
        - wrapt >=1.16.0,<2
        - seaborn-base >=0.13
        - matplotlib-base >=3.8
        - scipy >=1.11
      run_constraints:
        - statsmodels >=0.14.4
    tests:
      - package_contents:
          strict: true
          files:
            - etc/conda/test-files/maidr/**
          site_packages:
            - maidr/**
            - maidr-${{ version }}.dist-info/**
      - python:
          imports: maidr
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*

  - package:
      name: py-maidr-with-altair
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("py-maidr", exact=True) }}
        - altair >=5.0
    tests:
      - python:
          imports: maidr
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
    about:
      summary: Multimodal Access and Interactive Data Representations (with [altair])

  - package:
      name: py-maidr-with-jupyter
    requirements:
      run:
        - ${{ pin_subpackage("py-maidr", exact=True) }}
        - ipykernel >=6.0.0
        - jupyter >=1.0.0,<2
    tests:
      - python:
          imports: maidr
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
    about:
      summary: Multimodal Access and Interactive Data Representations (with [jupyter])

  - package:
      name: py-maidr-with-plotly
    requirements:
      run:
        - ${{ pin_subpackage("py-maidr", exact=True) }}
        - plotly >=5.0
        - contourpy >=1.0.1
    tests:
      - python:
          imports: maidr
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
    about:
      summary: Multimodal Access and Interactive Data Representations (with [plotly])

  - package:
      name: py-maidr-with-shiny
    requirements:
      run:
        - ${{ pin_subpackage("py-maidr", exact=True) }}
        - shiny >=1.0
    tests:
      - python:
          imports: maidr
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
    about:
      summary: Multimodal Access and Interactive Data Representations (with [shiny])

  - package:
      name: py-maidr-with-streamlit
    requirements:
      run:
        - ${{ pin_subpackage("py-maidr", exact=True) }}
        - streamlit >=1.30
    tests:
      - python:
          imports: maidr
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
    about:
      summary: Multimodal Access and Interactive Data Representations (with [streamlit])

  - package:
      name: py-maidr-with-visualization
    build:
      noarch: generic
    requirements:
      run:
        - ${{ pin_subpackage("py-maidr", exact=True) }}
        - flask >=3.0.0
        - seaborn-base
        # constraint above
        - statsmodels
    tests:
      - python:
          imports: maidr
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
    about:
      summary: Multimodal Access and Interactive Data Representations (with [visualization])

  - package:
      name: py-maidr-with-all
    requirements:
      run:
        - ${{ pin_subpackage("py-maidr-with-altair", exact=True) }}
        - ${{ pin_subpackage("py-maidr-with-jupyter", exact=True) }}
        - ${{ pin_subpackage("py-maidr-with-plotly", exact=True) }}
        - ${{ pin_subpackage("py-maidr-with-shiny", exact=True) }}
        - ${{ pin_subpackage("py-maidr-with-streamlit", exact=True) }}
        - ${{ pin_subpackage("py-maidr-with-visualization", exact=True) }}
        - ${{ pin_subpackage("py-maidr", exact=True) }}
    tests:
      - python:
          imports: maidr
          pip_check: true
          python_version:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
      - files:
          source:
            - src/tests/
            - src/pyproject.toml
        requirements:
          run:
            - cssselect >=1.2
            - pytest >=7.3.2,<8
            - pytest-cov
            - pytest-mock >=3.12.0,<4
            - python ${{ python_min }}.*
            # uses deprecated assumptions in test, using version from `uv.lock`
            #   AttributeError: module 'plotly.graph_objects' has no attribute 'Scattermapbox'
            - if: match(version, "1.25.0.*")
              then:
                - plotly 6.7.0.*
        script:
          - cd src
          - python -c "import os; [os.unlink(f'tests/{p}') for p in '''${{ unlink_tests }}'''.split()]"
          - coverage run --source maidr --branch -m pytest -vvv --tb=long --color=yes -k "${{ pytest_k }}"
          - coverage report --show-missing --skip-covered --fail-under=71
    about:
      summary: Multimodal Access and Interactive Data Representations (with all [extras])

about:
  homepage: https://pypi.org/project/maidr
  summary: Multimodal Access and Interactive Data Representations
  license: GPL-3.0-or-later
  license_file:
    - dist/LICENSE
    # TODO: js licenses?
  repository: https://github.com/xability/py-maidr
  documentation: https://py.maidr.ai

extra:
  feedstock-name: py-maidr
  recipe-maintainers:
    - bollwyvl
